<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub 連接成功</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      background: #f7f7f2;
      color: #1f2933;
    }

    main {
      width: min(680px, calc(100% - 32px));
      padding: 32px;
      border: 1px solid #d8d6ca;
      border-radius: 8px;
      background: #ffffff;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.2;
    }

    p {
      margin: 0;
      font-size: 18px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello! GitHub 連接成功！</h1>
    <p>這個頁面由 Codex 透過 GitHub CLI 推送，並準備用 GitHub Pages 發布。</p>
  </main>
</body>
</html>
